<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Barre du navigateur = fond de l'en-tête du site (bannière claire du 22/11/2026) : blanc en thème
         clair, --surface du thème sombre (#161f27) en sombre. Plus d'orange. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161f27" media="(prefers-color-scheme: dark)" />
    <meta name="google-site-verification" content="YN8YFvxUIagFQ8FKYtpZpWRSUVLtqeWLVjt2VCA-HPA" />
    <!-- Installabilité PWA sur iOS/iPadOS : Safari n'utilise ni le manifest Web App ni son champ
         `display` pour décider du mode plein écran — ces 3 balises `apple-*` sont indispensables en
         plus du manifest injecté par vite-plugin-pwa (voir vite.config.ts), qui suffit seul pour
         Android/Chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Maths FWB" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <title>Chapitres de maths — FWB</title>
    <!-- Filet de sécurité : si l'application ne démarre pas (ancien index.html en cache qui réclame un
         fichier JS disparu après un déploiement, service worker périmé…), on désinscrit le service
         worker, on vide les caches et on recharge UNE seule fois (garde en sessionStorage, retirée
         par src/main.tsx dès que l'application démarre). Script classique et inline, volontairement
         séparé du bundle : il doit fonctionner même quand le bundle ne se charge pas. -->
    <script>
      (function () {
        var KEY = 'recovery-reload'
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) return
            sessionStorage.setItem(KEY, '1')
          } catch (e) {
            return
          }
          var tasks = []
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }),
            )
          }
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }),
            )
          }
          Promise.all(tasks).catch(function () {}).then(function () { location.reload() })
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') recover()
          },
          true,
        )
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.children.length) recover()
        }, 10000)
      })()
    </script>
    <!-- Accueil « Mon année d'abord » : année de l'élève posée sur <html> AVANT le JS (même logique que
         src/lib/anneeAccueil.ts::anneeDeDepart — année choisie, sinon celle de la dernière étape
         ouverte), pour que la page pré-rendue n'affiche pas les cartes « Tu es en… » à un élève qui a
         déjà choisi. Rien d'envoyé : lecture du localStorage de ce navigateur seulement. -->
    <script>
      (function () {
        try {
          var a = localStorage.getItem('accueil:annee')
          if (!a) {
            var d = JSON.parse(localStorage.getItem('parcours:derniere-etape') || 'null')
            var q = -1
            if (d && typeof d === 'object') for (var k in d) if (d[k] && typeof d[k].quand === 'number' && d[k].quand > q) { q = d[k].quand; a = k }
          }
          if (a) document.documentElement.setAttribute('data-annee-accueil', a)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
